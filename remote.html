<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PubNub Latency Demo</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.2s ease;
            background-color: #f0f2f5;
        }
        .stats-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
            min-width: 300px;
        }
        #latency-display {
            font-size: 24px;
            font-weight: 800;
            color: #006F87;
            margin-top: 10px;
        }

        /* New Leaderboard Styles */
        #leaderboard {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
        .result-row {
            font-size: 13px;
            color: #555;
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f9f9f9;
        }
        .result-row span.fast { color: #2ecc71; font-weight: bold; }

        .button-grid { display: flex; gap: 15px; }
        button {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.9); }
        .red { background: #e74c3c; }
        .yellow { background: #f1c40f; }
        .blue { background: #3498db; }
        .green { background: #2ecc71; }
        .orange { background: #e67e22; }

        #username-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        #username-modal .modal-box {
            background: white; border-radius: 12px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 360px; text-align: center;
        }
        #username-modal h2 { margin: 0 0 8px; font-size: 1.4em; }
        #username-modal p { margin: 0 0 24px; color: #636e72; font-size: 14px; }
        #username-input {
            width: 100%; box-sizing: border-box;
            padding: 10px 14px; font-size: 15px;
            border: 2px solid #dfe6e9; border-radius: 8px;
            outline: none; margin-bottom: 16px;
        }
        #username-input:focus { border-color: #2d3436; }
        #username-modal button {
            width: 100%; padding: 11px;
            background: #2d3436; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        #username-modal button:hover { background: #636e72; }
    </style>
</head>
<body>

    <div id="username-modal">
        <div class="modal-box">
            <h2>Welcome</h2>
            <p>Enter a username to continue</p>
            <input type="text" id="username-input" placeholder="Your username..." />
            <button onclick="startDemo()">Continue</button>
        </div>
    </div>

    <div class="stats-container">
        <div id="status">Connecting...</div>
        <div id="last-sync">Waiting for event...</div>
        <div id="latency-display">-- ms</div>
        <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; color: #888;">One-Way Latency</div>

        <div id="leaderboard"></div>
    </div>

    <div class="button-grid">
        <button class="red" onclick="publishColor('#e74c3c')"></button>
        <button class="yellow" onclick="publishColor('#f1c40f')"></button>
        <button class="blue" onclick="publishColor('#3498db')"></button>
        <button class="green" onclick="publishColor('#2ecc71')"></button>
        <button class="orange" onclick="publishColor('#e67e22')"></button>
    </div>

    <script>
        let pubnub;
        const channel = "latency_test_channel";
        let currentUser = ""; // Store globally to use in reporting

        function startDemo() {
            const input = document.getElementById('username-input');
            const username = input.value.trim();
            if (!username) {
                input.focus();
                return;
            }

            currentUser = username;
            document.getElementById('username-modal').style.display = 'none';

            pubnub = new PubNub({
                publishKey: "pub-key-here",
                subscribeKey: "sub-key-here",
                userId: username
            });

            pubnub.subscribe({ channels: [channel] });

            pubnub.addListener({
                status: (s) => {
                    if (s.category === "PNConnectedCategory") {
                        document.getElementById('status').innerText = "🌐 Network Online";
                    }
                },
                message: (event) => {
                    const msg = event.message;

                    // --- LOGIC CHANGE 1: Handle Color Change & Publish Latency ---
                    if (msg.color) {
                        const now = Date.now();
                        const sentAt = msg.sentAt;

                        // 1. Calculate My Latency
                        const latency = now - sentAt;

                        // 2. Update UI
                        document.body.style.backgroundColor = msg.color;
                        document.getElementById('last-sync').innerText = "Sync from: " + event.publisher;
                        document.getElementById('latency-display').innerText = latency + " ms";

                        // 3. Clear Leaderboard (New Round)
                        document.getElementById('leaderboard').innerHTML = '<div style="font-size:10px; color:#aaa; margin-bottom:5px;">REAL-TIME RESULTS:</div>';

                        // 4. Publish MY Latency Result to the group
                        pubnub.publish({
                            channel: channel,
                            message: {
                                type: "report",       // Differentiates this from color messages
                                user: currentUser,
                                value: latency
                            }
                        });
                    }

                    // --- LOGIC CHANGE 2: Handle Incoming Latency Reports ---
                    else if (msg.type === "report") {
                        const board = document.getElementById('leaderboard');
                        const row = document.createElement('div');
                        row.className = 'result-row';
                        row.innerHTML = `
                            <strong>${msg.user}</strong>
                            <span class="${msg.value < 100 ? 'fast' : ''}">${msg.value} ms</span>
                        `;
                        board.appendChild(row);
                    }
                }
            });
        }

        document.getElementById('username-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startDemo();
        });

        function publishColor(hex) {
            const payload = {
                color: hex,
                sentAt: Date.now()
            };

            pubnub.publish({
                channel: channel,
                message: payload
            });
        }
    </script>
</body>
</html>
